<style>
/* ============================================================
   AI探索者 · 主页 v3 —— 终端开机 + 手绘桌面
   品牌三色：苔藓绿 #4E7A5C / 暖金 #E3B341 / 陶土红 #C4624D
   ============================================================ */
:root {
  --green: #4E7A5C;
  --green-deep: #3D6048;
  --gold: #E3B341;
  --terracotta: #C4624D;
  --cream: #E3DED0;
  --ink: #1A1A2E;
  --dark-panel: #151821;
  --dark-border: #2a2f3a;
  --term-green: #4ade80;
  --mono: "Fira Code", ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --fancy: "Fraunces", Georgia, serif;
  --hand: "Caveat", cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  background: var(--cream);
  overflow-x: hidden;
}

a { text-decoration: none; }

/* ============================================================
   阶段一：终端开机（全屏深色）
   ============================================================ */
.boot {
  position: fixed; inset: 0; z-index: 100;
  background:
    radial-gradient(900px circle at 50% -10%, rgba(78,122,92,.25), transparent 60%),
    var(--dark-panel);
  display: flex; align-items: center; justify-content: center;
  padding: 48px 24px;
  transition: opacity .5s ease, transform .5s ease;
}
.boot.leaving { opacity: 0; transform: translateY(-40px); pointer-events: none; }
.terminal {
  width: 100%; max-width: 860px;
  background: rgba(21, 24, 33, .92);
  border: 1px solid var(--dark-border);
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
  overflow: hidden;
}
.term-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: #1c2130;
  border-bottom: 1px solid var(--dark-border);
  font-family: var(--mono); font-size: .8rem; color: #94a3b8;
}
.term-dot { width: 12px; height: 12px; border-radius: 50%; }
.term-dot.r { background: #ff5f57; }
.term-dot.y { background: #febc2e; }
.term-dot.g { background: #28c840; }
.term-title { margin-left: 8px; letter-spacing: .5px; }
.term-body {
  padding: 28px 28px 34px;
  font-family: var(--mono);
  font-size: clamp(.85rem, 1.6vw, 1rem);
  line-height: 1.9;
  min-height: 380px;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.prompt { color: var(--term-green); }
.prompt::before { content: "➜ "; }
.cmd { color: #e2e8f0; }
.out { color: #94a3b8; }
.out .hl { color: var(--gold); }
.out .hlg { color: var(--term-green); }
.out .hlb { color: #7aa2f7; }
.out .hlp { color: #f87171; }
.cursor {
  display: inline-block; width: .6em; height: 1.05em;
  background: var(--term-green); vertical-align: text-bottom;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.launch-line {
  margin-top: 26px;
  font-family: var(--mono);
  color: var(--gold);
  font-size: clamp(.9rem, 2vw, 1.05rem);
  animation: pulse 1.6s ease-in-out infinite;
  cursor: pointer;
  user-select: none;
}
.launch-line:hover { text-decoration: underline; }
@keyframes pulse { 50% { opacity: .45; } }

/* ============================================================
   阶段二：手绘桌面（壁纸背景）
   ============================================================ */
.desktop {
  position: fixed; inset: 0;
  background: url("assets/images/handdrawn-wallpaper.jpg") center / cover no-repeat;
  opacity: 0; visibility: hidden;
  transition: opacity .8s ease;
  display: flex; flex-direction: column;
  user-select: none;
}
.desktop.show { opacity: 1; visibility: visible; }

/* 顶部菜单栏（毛玻璃） */
.menubar {
  height: 46px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  background: rgba(26, 26, 38, .38);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,.08);
  color: #fff;
  font-size: .85rem;
  flex-shrink: 0;
}
.menubar-left { display: flex; align-items: center; gap: 18px; }
.mb-apple { font-size: 1.05rem; }
.mb-brand { font-weight: 700; font-family: var(--serif); font-size: .95rem; }
.mb-menu { display: flex; gap: 16px; }
.mb-menu a { color: rgba(255,255,255,.85); font-size: .82rem; transition: color .2s; }
.mb-menu a:hover { color: #fff; }
.menubar-right { display: flex; align-items: center; gap: 16px; font-size: .82rem; color: rgba(255,255,255,.9); }

/* 桌面图标区 */
.desk-area {
  flex: 1;
  position: relative;
  padding: 28px 40px 120px;
}
.desk-icons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 34px 20px;
  max-width: 900px;
  margin: 0 auto;
}
.dicon {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 14px 8px;
  border-radius: 14px;
  transition: transform .22s ease, background .22s ease;
}
.dicon:hover { transform: scale(1.08); background: rgba(255,255,255,.16); }
.dicon:active { transform: scale(.95); }
.dicon-img {
  width: 74px; height: 74px;
  border-radius: 19px;
  display: grid; place-items: center;
  font-size: 2.1rem;
  background: linear-gradient(145deg, color-mix(in srgb, var(--g, var(--green)) 82%, #fff), var(--g, var(--green)));
  box-shadow: 0 10px 24px rgba(26,26,38,.28), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .22s ease;
}
.dicon:hover .dicon-img { transform: translateY(-2px); }
.dicon-label {
  color: #fff;
  font-size: .8rem;
  font-weight: 600;
  background: rgba(26, 26, 38, .38);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 8px;
  padding: 3px 9px;
  max-width: 130px;
  text-align: center;
  line-height: 1.35;
  text-shadow: 0 1px 2px rgba(0,0,0,.6);
}
/* 错落摆放：模拟真实桌面 */
.dicon:nth-child(2) { transform: translateY(18px); }
.dicon:nth-child(3) { transform: translateY(6px); }
.dicon:nth-child(4) { transform: translateY(26px); }
.dicon:nth-child(5) { transform: translateY(10px); }
.dicon:nth-child(6) { transform: translateY(30px); }
.dicon:nth-child(7) { transform: translateY(14px); }
.dicon:nth-child(8) { transform: translateY(34px); }
.dicon:nth-child(9) { transform: translateY(22px); }
.dicon:nth-child(10) { transform: translateY(40px); }
.dicon:nth-child(11) { transform: translateY(28px); }
.dicon:hover { transform: scale(1.08) translateY(0); }

/* 桌面便签（随机金句） */
.sticky-note {
  position: absolute;
  top: 24px; right: 34px;
  background: rgba(255, 243, 205, .92);
  backdrop-filter: blur(4px);
  border-radius: 6px;
  padding: 18px 20px 14px;
  max-width: 260px;
  box-shadow: 0 10px 30px rgba(26,26,38,.22);
  transform: rotate(2.2deg);
  font-family: var(--hand);
  color: #4a3c14;
  font-size: 1.15rem;
  line-height: 1.55;
  font-weight: 700;
}
.sticky-note::before {
  content: ""; position: absolute; top: -10px; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 18px;
  background: rgba(255, 243, 205, .95);
  border-radius: 3px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

/* Dock */
.dock {
  position: absolute; left: 50%; bottom: 18px;
  transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 10px;
  padding: 10px 16px;
  background: rgba(255,255,255,.45);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.55);
  border-radius: 26px;
  box-shadow: 0 14px 40px rgba(26,26,38,.35);
}
.dock-item {
  width: 50px; height: 50px;
  border-radius: 13px;
  display: grid; place-items: center;
  font-size: 1.5rem;
  background: linear-gradient(145deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
  box-shadow: 0 4px 10px rgba(26,26,38,.18), inset 0 1px 0 rgba(255,255,255,.8);
  transition: transform .18s ease;
}
.dock-item:hover { transform: translateY(-8px) scale(1.1); }
.dock-sep {
  width: 1px; height: 40px; align-self: center;
  background: rgba(26,26,38,.18);
  margin: 0 4px;
}

/* ============================================================
   灵感碎片弹窗（macOS 窗口风格，仅自己可见）
   ============================================================ */
.frag-window {
  position: fixed; left: 50%; top: 50%;
  transform: translate(-50%, -50%) scale(.96);
  width: min(560px, 92vw);
  max-height: 72vh;
  background: rgba(255,255,255,.96);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 14px;
  box-shadow: 0 30px 80px rgba(26,26,38,.45);
  z-index: 90;
  opacity: 0; visibility: hidden;
  transition: opacity .25s ease, transform .25s ease;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.frag-window.show { opacity: 1; visibility: visible; transform: translate(-50%, -50%) scale(1); }
.frag-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: #f2ede2;
  border-bottom: 1px solid rgba(26,26,46,.08);
  flex-shrink: 0;
}
.frag-title { flex: 1; font-size: .85rem; font-weight: 600; color: var(--ink); margin-left: 6px; }
.frag-close { cursor: pointer; color: #8a8a9a; font-size: .9rem; padding: 2px 6px; border-radius: 6px; }
.frag-close:hover { background: rgba(26,26,46,.08); color: var(--ink); }
.frag-body { padding: 22px 24px; overflow-y: auto; color: var(--ink); }
.frag-lock { text-align: center; padding: 20px 0 10px; }
.frag-lock-icon { font-size: 2.6rem; margin-bottom: 10px; }
.frag-tip { font-size: .9rem; color: #4A4A5A; margin-bottom: 16px; line-height: 1.7; }
.frag-input {
  width: 100%; padding: 10px 14px; border-radius: 10px;
  border: 1.5px solid rgba(26,26,46,.15); font-size: .95rem;
  font-family: var(--sans); outline: none; margin-bottom: 10px;
  background: #fff; color: var(--ink);
}
.frag-input:focus { border-color: var(--terracotta); }
.frag-btn {
  width: 100%; padding: 10px; border: none; border-radius: 10px;
  background: var(--terracotta); color: #fff; font-size: .95rem; font-weight: 600;
  cursor: pointer; font-family: var(--sans);
}
.frag-btn:hover { filter: brightness(1.06); }
.frag-err { color: #c0392b; font-size: .82rem; margin-top: 8px; min-height: 1.2em; }
.frag-list { list-style: none; }
.frag-item {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 12px 14px; margin-bottom: 10px;
  background: #faf6eb; border-radius: 10px;
  border-left: 3px solid var(--gold);
}
.frag-item-text { flex: 1; font-size: .92rem; line-height: 1.6; word-break: break-word; white-space: pre-wrap; }
.frag-item-del { cursor: pointer; color: #b0a99a; font-size: .85rem; padding: 2px 6px; border-radius: 6px; flex-shrink: 0; }
.frag-item-del:hover { color: #c0392b; background: rgba(192,57,43,.08); }
.frag-add { display: flex; gap: 10px; margin-top: 14px; }
.frag-add .frag-input { margin-bottom: 0; }
.frag-add .frag-btn { width: auto; padding: 10px 18px; flex-shrink: 0; }
.frag-empty { text-align: center; color: #b0a99a; font-size: .88rem; padding: 26px 0; }
.frag-note { font-size: .75rem; color: #b0a99a; margin-top: 14px; text-align: center; }

/* 响应式 */
@media (max-width: 900px) {
  .desk-icons { grid-template-columns: repeat(3, 1fr); gap: 26px 14px; }
  .dicon-img { width: 64px; height: 64px; font-size: 1.8rem; }
  .sticky-note { display: none; }
  .mb-menu { display: none; }
}
@media (max-width: 600px) {
  .desk-icons { grid-template-columns: repeat(2, 1fr); }
  .dicon:nth-child(n) { transform: none; }
  .dock-item { width: 44px; height: 44px; font-size: 1.3rem; }
  .desk-area { padding: 20px 18px 110px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<script>
/* ============================================================
   可编辑内容区
   ============================================================ */
const BOOT_LINES = [
  { cmd: "whoami", out: ["<span class='hlg'>长野</span> · AI时代的认真生活的男生"] },
  { cmd: "cat about.md", out: [
      "> 在物理世界里认真生活，也用 AI 重新长出自己。",
      "> 相信 AI 和物理世界不是两回事——认真生活，就是最好的落地。"
  ]},
  { cmd: "ls ~/works", out: ["<span class='hlb'>📖 实践手记</span>  <span class='hl'>🤖 AI实践</span>  <span class='hlb'>📚 书架</span>  <span class='hl'>🚀 项目</span>  <span class='hlb'>🎨 作品</span>"] },
  { cmd: "./launch.sh --start" }
];
const FORTUNES = [
  "看见框架，然后真实地活。",
  "边长新能力，边让他人看见。",
  "AI 让边际成本趋近于零，个体第一次可以绕过组织直接触达人群。",
  "热爱可抵岁月漫长。"
];
const TYPE_SPEED = 26;
/* ============================================================ */

const termBody = document.getElementById("termBody");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeLine(promptEl, cmd) {
  if (reduceMotion) { promptEl.innerHTML = cmd; return; }
  for (let i = 0; i <= cmd.length; i++) {
    promptEl.innerHTML = cmd.slice(0, i) + '<span class="cursor"></span>';
    await sleep(TYPE_SPEED);
  }
}

async function boot() {
  for (const line of BOOT_LINES) {
    const div = document.createElement("div");
    div.className = "term-line";
    div.innerHTML = '<span class="prompt"></span><span class="cmd"></span>';
    termBody.appendChild(div);
    await typeLine(div.querySelector(".cmd"), line.cmd);
    await sleep(180);
    if (line.out) {
      for (const o of line.out) {
        const od = document.createElement("div");
        od.className = "term-line out";
        od.innerHTML = o;
        termBody.appendChild(od);
        await sleep(160);
      }
    }
    await sleep(240);
  }
  const launch = document.createElement("div");
  launch.className = "launch-line";
  launch.id = "launchLine";
  launch.innerHTML = "Press Enter to Launch ⏎";
  launch.tabIndex = 0;
  launch.addEventListener("click", enterDesktop);
  launch.addEventListener("keydown", e => { if (e.key === "Enter") enterDesktop(); });
  termBody.appendChild(launch);
}

function enterDesktop() {
  const bootEl = document.getElementById("boot");
  const desk = document.getElementById("desktop");
  if (bootEl.classList.contains("leaving")) return;
  sessionStorage.setItem("aiexplorer_booted", "1");
  bootEl.classList.add("leaving");
  desk.classList.add("show");
  setTimeout(() => bootEl.style.display = "none", 600);
}

/* 已开机过（从子页面返回/刷新）→ 直接显示桌面，不再开机 */
if (sessionStorage.getItem("aiexplorer_booted")) {
  document.getElementById("boot").style.display = "none";
  document.getElementById("desktop").classList.add("show");
} else {
  boot();
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("launchLine")) enterDesktop();
});

/* 桌面便签金句 */
document.getElementById("sticky").textContent = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];

/* 菜单栏时钟 */
function tick() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("clock").textContent = wd + " " + hh + ":" + mm;
}
tick();
setInterval(tick, 30000);

/* ============================================================
   灵感碎片（仅自己可见）
   密码哈希 + 碎片密文均存在本机浏览器 localStorage：
   别人访问网站时根本不会有你的数据；同机偷看需密码。
   ============================================================ */
const FRAG_PW_KEY = "aiexplorer_frag_pw_v1";
const FRAG_DATA_KEY = "aiexplorer_frag_data_v1";
const FRAG_UNLOCKED = "aiexplorer_frag_unlocked_v1";
const FRAG_SALT = new Uint8Array([0x4E,0x7A,0x5C,0xE3,0xB3,0x41,0xC4,0x62,0x4D,0x1A,0x1A,0x2E,0xE3,0xDE,0xD0,0x88]);

const fragWin = document.getElementById("fragWin");
function b64(u8) { let s = ""; for (const b of u8) s += String.fromCharCode(b); return btoa(s); }
function unb64(s) { const bin = atob(s); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); return u8; }
async function sha256hex(str) {
  const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(d)).map(b => b.toString(16).padStart(2, "0")).join("");
}
async function fragKey(pass) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: FRAG_SALT, iterations: 120000, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function fragEncrypt(list, pass) {
  const key = await fragKey(pass);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(JSON.stringify(list)));
  return b64(iv) + "." + b64(new Uint8Array(ct));
}
async function fragDecrypt(data, pass) {
  const [ivS, ctS] = data.split(".");
  const key = await fragKey(pass);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(ivS) }, key, unb64(ctS));
  return JSON.parse(new TextDecoder().decode(pt));
}

let fragPass = "";
let fragList = [];
let fragBusy = false;

function openFrags() {
  fragWin.classList.add("show");
  document.getElementById("fragErrSetup").textContent = "";
  document.getElementById("fragErrUnlock").textContent = "";
  if (sessionStorage.getItem(FRAG_UNLOCKED)) { showFrags(); return; }
  if (localStorage.getItem(FRAG_PW_KEY)) {
    document.getElementById("fragSetup").style.display = "none";
    document.getElementById("fragUnlock").style.display = "block";
  } else {
    document.getElementById("fragSetup").style.display = "block";
    document.getElementById("fragUnlock").style.display = "none";
  }
}
function closeFrags() { fragWin.classList.remove("show"); }

async function setupFrags() {
  const p1 = document.getElementById("fragPass1").value;
  const p2 = document.getElementById("fragPass2").value;
  const err = document.getElementById("fragErrSetup");
  if (p1.length < 4) { err.textContent = "密码至少 4 位"; return; }
  if (p1 !== p2) { err.textContent = "两次输入的密码不一致"; return; }
  fragPass = p1;
  localStorage.setItem(FRAG_PW_KEY, await sha256hex(p1));
  localStorage.setItem(FRAG_DATA_KEY, await fragEncrypt([], p1));
  sessionStorage.setItem(FRAG_UNLOCKED, "1");
  document.getElementById("fragPass1").value = "";
  document.getElementById("fragPass2").value = "";
  await showFrags();
}
async function unlockFrags() {
  const pass = document.getElementById("fragPass").value;
  const err = document.getElementById("fragErrUnlock");
  if (!pass) { err.textContent = "请输入密码"; return; }
  if ((await sha256hex(pass)) !== localStorage.getItem(FRAG_PW_KEY)) { err.textContent = "密码不对，再试试"; return; }
  fragPass = pass;
  sessionStorage.setItem(FRAG_UNLOCKED, "1");
  document.getElementById("fragPass").value = "";
  await showFrags();
}

async function showFrags() {
  const data = localStorage.getItem(FRAG_DATA_KEY);
  if (!data) {
    fragList = [];
  } else {
    try { fragList = await fragDecrypt(data, fragPass); }
    catch (e) {
      /* 密码丢失/无效（如刷新后）→ 回到锁界面重新解锁 */
      sessionStorage.removeItem(FRAG_UNLOCKED);
      fragPass = "";
      document.getElementById("fragLock").style.display = "block";
      document.getElementById("fragContent").style.display = "none";
      document.getElementById("fragSetup").style.display = "none";
      document.getElementById("fragUnlock").style.display = "block";
      document.getElementById("fragErrUnlock").textContent = "会话已过期，请重新输入密码";
      return;
    }
  }
  document.getElementById("fragLock").style.display = "none";
  document.getElementById("fragContent").style.display = "block";
  renderFrags();
}
function renderFrags() {
  const ul = document.getElementById("fragList");
  const empty = document.getElementById("fragEmpty");
  ul.innerHTML = "";
  if (!fragList.length) { empty.style.display = "block"; return; }
  empty.style.display = "none";
  fragList.forEach((t, i) => {
    const li = document.createElement("li");
    li.className = "frag-item";
    li.innerHTML = '<span class="frag-item-text"></span><span class="frag-item-del" title="删除">✕</span>';
    li.querySelector(".frag-item-text").textContent = t;
    li.querySelector(".frag-item-del").addEventListener("click", () => delFrag(i));
    ul.appendChild(li);
  });
}
async function addFrag() {
  if (fragBusy) return;
  fragBusy = true;
  try {
    const inp = document.getElementById("fragNew");
    const t = inp.value.trim();
    if (!t) return;
    fragList.unshift(t);
    localStorage.setItem(FRAG_DATA_KEY, await fragEncrypt(fragList, fragPass));
    inp.value = "";
    renderFrags();
  } finally { fragBusy = false; }
}
async function delFrag(i) {
  if (fragBusy) return;
  fragBusy = true;
  try {
    fragList.splice(i, 1);
    localStorage.setItem(FRAG_DATA_KEY, await fragEncrypt(fragList, fragPass));
    renderFrags();
  } finally { fragBusy = false; }
}

["fragPass", "fragPass1", "fragPass2", "fragNew"].forEach(id => {
  document.getElementById(id).addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    if (id === "fragPass") unlockFrags();
    else if (id === "fragPass1" || id === "fragPass2") setupFrags();
    else addFrag();
  });
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && fragWin.classList.contains("show")) closeFrags();
});
</script>
