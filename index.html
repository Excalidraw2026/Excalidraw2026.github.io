<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI探索者 · 长野的个人主页</title>
<meta name="description" content="长野（AI探索者）的个人主页 —— AI时代的认真生活的男生 · AI 与物理世界的结合。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;0,9..144,900;1,9..144,400;1,9..144,700&family=Caveat:wght@400;700&family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AI探索者 · 主页 v3 —— 终端开机 + 手绘桌面
   品牌三色：苔藓绿 #4E7A5C / 暖金 #E3B341 / 陶土红 #C4624D
   ============================================================ */
:root {
  --green: #4E7A5C;
  --green-deep: #3D6048;
  --gold: #E3B341;
  --terracotta: #C4624D;
  --cream: #fefcf6;
  --ink: #1A1A2E;
  --dark-panel: #151821;
  --dark-border: #2a2f3a;
  --term-green: #4ade80;
  --mono: "Fira Code", ui-monospace, "Cascadia Code", Consolas, "Courier New", monospace;
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --fancy: "Fraunces", Georgia, serif;
  --hand: "Caveat", cursive;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--sans);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  background: var(--cream);
  overflow-x: hidden;
}

a { text-decoration: none; }

/* ============================================================
   阶段一：终端开机（全屏深色）
   ============================================================ */
.boot {
  position: fixed; inset: 0; z-index: 100;
  background:
    radial-gradient(900px circle at 50% -10%, rgba(78,122,92,.25), transparent 60%),
    var(--dark-panel);
  display: flex; align-items: center; justify-content: center;
  padding: 48px 24px;
  transition: opacity .5s ease, transform .5s ease;
}
.boot.leaving { opacity: 0; transform: translateY(-40px); pointer-events: none; }
.terminal {
  width: 100%; max-width: 860px;
  background: rgba(21, 24, 33, .92);
  border: 1px solid var(--dark-border);
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(0,0,0,.5);
  overflow: hidden;
}
.term-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px;
  background: #1c2130;
  border-bottom: 1px solid var(--dark-border);
  font-family: var(--mono); font-size: .8rem; color: #94a3b8;
}
.term-dot { width: 12px; height: 12px; border-radius: 50%; }
.term-dot.r { background: #ff5f57; }
.term-dot.y { background: #febc2e; }
.term-dot.g { background: #28c840; }
.term-title { margin-left: 8px; letter-spacing: .5px; }
.term-body {
  padding: 28px 28px 34px;
  font-family: var(--mono);
  font-size: clamp(.85rem, 1.6vw, 1rem);
  line-height: 1.9;
  min-height: 380px;
}
.term-line { white-space: pre-wrap; word-break: break-word; }
.prompt { color: var(--term-green); }
.prompt::before { content: "➜ "; }
.cmd { color: #e2e8f0; }
.out { color: #94a3b8; }
.out .hl { color: var(--gold); }
.out .hlg { color: var(--term-green); }
.out .hlb { color: #7aa2f7; }
.out .hlp { color: #f87171; }
.cursor {
  display: inline-block; width: .6em; height: 1.05em;
  background: var(--term-green); vertical-align: text-bottom;
  animation: blink 1s steps(1) infinite;
}
@keyframes blink { 50% { opacity: 0; } }
.launch-line {
  margin-top: 26px;
  font-family: var(--mono);
  color: var(--gold);
  font-size: clamp(.9rem, 2vw, 1.05rem);
  animation: pulse 1.6s ease-in-out infinite;
  cursor: pointer;
  user-select: none;
}
.launch-line:hover { text-decoration: underline; }
@keyframes pulse { 50% { opacity: .45; } }

/* ============================================================
   阶段二：手绘桌面（壁纸背景）
   ============================================================ */
.desktop {
  position: fixed; inset: 0;
  background: url("assets/images/handdrawn-wallpaper-brand.png") center / cover no-repeat;
  opacity: 0; visibility: hidden;
  transition: opacity .8s ease;
  display: flex; flex-direction: column;
  user-select: none;
}
.desktop.show { opacity: 1; visibility: visible; }

/* 顶部菜单栏（毛玻璃） */
.menubar {
  height: 46px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 18px;
  background: rgba(26, 26, 38, .38);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,.08);
  color: #fff;
  font-size: .85rem;
  flex-shrink: 0;
}
.menubar-left { display: flex; align-items: center; gap: 18px; }
.mb-apple { font-size: 1.05rem; }
.mb-brand { font-weight: 700; font-family: var(--serif); font-size: .95rem; }
.mb-menu { display: flex; gap: 16px; }
.mb-menu a { color: rgba(255,255,255,.85); font-size: .82rem; transition: color .2s; }
.mb-menu a:hover { color: #fff; }
.menubar-right { display: flex; align-items: center; gap: 16px; font-size: .82rem; color: rgba(255,255,255,.9); }

/* 桌面图标区 */
.desk-area {
  flex: 1;
  position: relative;
  padding: 28px 40px 120px;
}
.desk-icons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 34px 20px;
  max-width: 900px;
  margin: 0 auto;
}
.dicon {
  display: flex; flex-direction: column; align-items: center; gap: 9px;
  padding: 14px 8px;
  border-radius: 14px;
  transition: transform .22s ease, background .22s ease;
}
.dicon:hover { transform: scale(1.08); background: rgba(255,255,255,.16); }
.dicon:active { transform: scale(.95); }
.dicon-img {
  width: 74px; height: 74px;
  border-radius: 19px;
  display: grid; place-items: center;
  font-size: 2.1rem;
  background: linear-gradient(145deg, color-mix(in srgb, var(--g, var(--green)) 82%, #fff), var(--g, var(--green)));
  box-shadow: 0 10px 24px rgba(26,26,38,.28), inset 0 1px 0 rgba(255,255,255,.35);
  transition: transform .22s ease;
}
.dicon:hover .dicon-img { transform: translateY(-2px); }
.dicon-label {
  color: #fff;
  font-size: .82rem;
  font-weight: 500;
  text-shadow: 0 1px 3px rgba(0,0,0,.75);
  text-align: center;
  line-height: 1.3;
}
/* 错落摆放：模拟真实桌面 */
.dicon:nth-child(2) { transform: translateY(18px); }
.dicon:nth-child(3) { transform: translateY(6px); }
.dicon:nth-child(4) { transform: translateY(26px); }
.dicon:nth-child(5) { transform: translateY(10px); }
.dicon:nth-child(6) { transform: translateY(30px); }
.dicon:nth-child(7) { transform: translateY(14px); }
.dicon:nth-child(8) { transform: translateY(34px); }
.dicon:nth-child(9) { transform: translateY(22px); }
.dicon:nth-child(10) { transform: translateY(40px); }
.dicon:nth-child(11) { transform: translateY(28px); }
.dicon:hover { transform: scale(1.08) translateY(0); }

/* 桌面便签（随机金句） */
.sticky-note {
  position: absolute;
  top: 24px; right: 34px;
  background: rgba(255, 243, 205, .88);
  backdrop-filter: blur(4px);
  border-radius: 6px;
  padding: 18px 20px 14px;
  max-width: 260px;
  box-shadow: 0 10px 30px rgba(26,26,38,.22);
  transform: rotate(2.2deg);
  font-family: var(--hand);
  color: #5a4a1a;
  font-size: 1.15rem;
  line-height: 1.55;
}
.sticky-note::before {
  content: ""; position: absolute; top: -10px; left: 50%;
  transform: translateX(-50%);
  width: 60px; height: 18px;
  background: rgba(255, 243, 205, .95);
  border-radius: 3px;
  box-shadow: 0 2px 6px rgba(0,0,0,.08);
}

/* Dock */
.dock {
  position: absolute; left: 50%; bottom: 18px;
  transform: translateX(-50%);
  display: flex; align-items: flex-end; gap: 10px;
  padding: 10px 16px;
  background: rgba(255,255,255,.3);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,.4);
  border-radius: 26px;
  box-shadow: 0 14px 40px rgba(26,26,38,.3);
}
.dock-item {
  width: 50px; height: 50px;
  border-radius: 13px;
  display: grid; place-items: center;
  font-size: 1.5rem;
  background: linear-gradient(145deg, rgba(255,255,255,.85), rgba(255,255,255,.55));
  box-shadow: 0 4px 10px rgba(26,26,38,.18), inset 0 1px 0 rgba(255,255,255,.8);
  transition: transform .18s ease;
}
.dock-item:hover { transform: translateY(-8px) scale(1.1); }
.dock-sep {
  width: 1px; height: 40px; align-self: center;
  background: rgba(26,26,38,.18);
  margin: 0 4px;
}

/* 响应式 */
@media (max-width: 900px) {
  .desk-icons { grid-template-columns: repeat(3, 1fr); gap: 26px 14px; }
  .dicon-img { width: 64px; height: 64px; font-size: 1.8rem; }
  .sticky-note { display: none; }
  .mb-menu { display: none; }
}
@media (max-width: 600px) {
  .desk-icons { grid-template-columns: repeat(2, 1fr); }
  .dicon:nth-child(n) { transform: none; }
  .dock-item { width: 44px; height: 44px; font-size: 1.3rem; }
  .desk-area { padding: 20px 18px 110px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<!-- ================= 终端开机 ================= -->
<div class="boot" id="boot">
  <div class="terminal" role="img" aria-label="终端风格开机动画">
    <div class="term-bar">
      <span class="term-dot r"></span><span class="term-dot y"></span><span class="term-dot g"></span>
      <span class="term-title">长野@localhost: ~</span>
    </div>
    <div class="term-body" id="termBody">
      <noscript><p class="out">请启用 JavaScript 查看终端动画，点击下方链接直接进入：<a href="#desktop" style="color:#4ade80" onclick="enterDesktop()">进入桌面</a></p></noscript>
    </div>
  </div>
</div>

<!-- ================= 手绘桌面 ================= -->
<div class="desktop" id="desktop">
  <!-- 菜单栏 -->
  <div class="menubar">

      <span class="mb-apple">🌱</span>
      <span class="mb-brand">AI探索者</span>
      <div class="mb-menu">

  </div>

  <!-- 桌面图标 -->
  <div class="desk-area">

    <div class="desk-icons">
      <a class="dicon" style="--g:#4E7A5C" href="about.html">

      </a>

      </a>
      <a class="dicon" style="--g:#E3B341" href="works.html">

      </a>
      <a class="dicon" style="--g:#C4624D" href="projects.html">
        <span class="dicon-img">🚀</span><span class="dicon-label">正在折腾的项目</span>
      </a>
      <a class="dicon" style="--g:#E3B341" href="timeline.html">
        <span class="dicon-img">🗺️</span><span class="dicon-label">我的成长路径</span>
      </a>
      <a class="dicon" style="--g:#C4624D" href="notes.html">
        <span class="dicon-img">💡</span><span class="dicon-label">灵感碎片</span>
      </a>
      <a class="dicon" style="--g:#4E7A5C" href="contact.html">
        <span class="dicon-img">📮</span><span class="dicon-label">订阅 / 关注我</span>
      </a>
      <a class="dicon" style="--g:#E3B341" href="coming.html">
        <span class="dicon-img">⭐</span><span class="dicon-label">推荐清单</span>
      </a>
      <a class="dicon" style="--g:#4E7A5C" href="contact.html">
        <span class="dicon-img">✉️</span><span class="dicon-label">联系我</span>
      </a>
      <a class="dicon" style="--g:#C4624D" href="about-site.html">
        <span class="dicon-img">🧱</span><span class="dicon-label">这个站是怎么做的</span>
      </a>
    </div>
  </div>

  <!-- Dock -->
  <div class="dock">
    <a class="dock-item" href="about.html" title="关于我">🌱</a>
    <a class="dock-item" href="blog.html" title="博客">📖</a>
    <a class="dock-item" href="works.html" title="作品集">🎨</a>

    <span class="dock-sep"></span>
    <a class="dock-item" href="coming.html" title="建设中">🗑️</a>
  </div>
</div>

<script>
/* ============================================================
   可编辑内容区
   ============================================================ */
const BOOT_LINES = [
  { cmd: "whoami", out: ["<span class='hlg'>长野</span> · AI时代的认真生活的男生"] },
  { cmd: "cat about.md", out: [
      "> 在物理世界里认真生活，也用 AI 重新长出自己。",
      "> 相信 AI 和物理世界不是两回事——认真生活，就是最好的落地。"
  ]},
  { cmd: "ls ~/works", out: ["<span class='hlb'>📖 实践手记</span>  <span class='hl'>🤖 AI实践</span>  <span class='hlb'>📚 书架</span>  <span class='hl'>🚀 项目</span>  <span class='hlb'>🎨 作品</span>"] },
  { cmd: "./launch.sh --start" }
];
const FORTUNES = [
  "看见框架，然后真实地活。",
  "边长新能力，边让他人看见。",
  "AI 让边际成本趋近于零，个体第一次可以绕过组织直接触达人群。",
  "热爱可抵岁月漫长。"
];
const TYPE_SPEED = 26;
/* ============================================================ */

const termBody = document.getElementById("termBody");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function typeLine(promptEl, cmd) {
  if (reduceMotion) { promptEl.innerHTML = cmd; return; }
  for (let i = 0; i <= cmd.length; i++) {
    promptEl.innerHTML = cmd.slice(0, i) + '<span class="cursor"></span>';
    await sleep(TYPE_SPEED);
  }
}

async function boot() {
  for (const line of BOOT_LINES) {
    const div = document.createElement("div");
    div.className = "term-line";
    div.innerHTML = '<span class="prompt"></span><span class="cmd"></span>';
    termBody.appendChild(div);
    await typeLine(div.querySelector(".cmd"), line.cmd);
    await sleep(180);
    if (line.out) {
      for (const o of line.out) {
        const od = document.createElement("div");
        od.className = "term-line out";
        od.innerHTML = o;
        termBody.appendChild(od);
        await sleep(160);
      }
    }
    await sleep(240);
  }
  const launch = document.createElement("div");
  launch.className = "launch-line";
  launch.id = "launchLine";
  launch.innerHTML = "Press Enter to Launch ⏎";
  launch.tabIndex = 0;
  launch.addEventListener("click", enterDesktop);
  launch.addEventListener("keydown", e => { if (e.key === "Enter") enterDesktop(); });
  termBody.appendChild(launch);
}

function enterDesktop() {
  const bootEl = document.getElementById("boot");
  const desk = document.getElementById("desktop");
  if (bootEl.classList.contains("leaving")) return;
  bootEl.classList.add("leaving");
  desk.classList.add("show");
  setTimeout(() => bootEl.style.display = "none", 600);
}

document.addEventListener("keydown", e => {
  if (e.key === "Enter" && document.getElementById("launchLine")) enterDesktop();
});

/* 桌面便签金句 */
document.getElementById("sticky").textContent = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];

/* 菜单栏时钟 */
function tick() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  const wd = ["周日","周一","周二","周三","周四","周五","周六"][d.getDay()];
  document.getElementById("clock").textContent = wd + " " + hh + ":" + mm;
}
tick();
setInterval(tick, 30000);

boot();
</script>
</body>
